<fuse-card
    class="tw-mt-8 tw-flex tw-w-full tw-max-w-140 tw-flex-col tw-p-6 tw-pb-6 sm:tw-p-8"
>
    <div class="tw-text-xl tw-font-semibold">Crear publicación</div>

    <form [formGroup]="postForm" (ngSubmit)="onSubmit()">
        <div class="tw-mt-8 tw-flex tw-flex-col tw-items-start sm:tw-flex-row">
            <div class="tw-mb-6 tw-flex tw-items-center sm:tw-mb-0">
                <hr-avatar class="tw-mr-4" [data]="user()" [size]="48"></hr-avatar>
                <div class="sm:tw-hidden">{{ user()?.displayName }}</div>
            </div>
            <mat-form-field class="tw-w-full" [subscriptSizing]="'dynamic'">
                <textarea
                    matInput
                    formControlName="text"
                    [placeholder]="'¿Qué tienes en mente?'"
                    [rows]="3"
                    cdkTextareaAutosize
                    [maxlength]="maxCharacters"
                ></textarea>
                <mat-hint align="end"
                    >{{ text?.value?.length || 0 }}/{{
                        maxCharacters
                    }}</mat-hint
                >
                <mat-error *ngIf="text?.hasError('required')">
                    El texto es requerido
                </mat-error>
                <mat-error *ngIf="text?.hasError('maxlength')">
                    El texto no puede exceder 2000 caracteres
                </mat-error>
            </mat-form-field>
        </div>

        <!-- Image previews -->
        <div class="tw-mt-4" *ngIf="imagePreviewUrls.length > 0">
            <div class="tw-grid tw-grid-cols-2 tw-gap-4 sm:tw-grid-cols-3">
                <div
                    *ngFor="let imageUrl of imagePreviewUrls; index as i"
                    class="tw-group tw-relative"
                >
                    <img
                        [src]="imageUrl"
                        alt="Preview"
                        class="tw-h-32 tw-w-full tw-rounded-lg tw-object-cover"
                    />
                    <button
                        type="button"
                        (click)="removeImage(i)"
                        class="tw-absolute tw-right-1 tw-top-1 tw-flex tw-h-8 tw-w-8 tw-items-center tw-justify-center tw-rounded-full tw-bg-neutral-400 tw-opacity-0 tw-transition-opacity group-hover:tw-opacity-100"
                    >
                        <mat-icon class="tw-text-lg tw-text-black"
                            >close</mat-icon
                        >
                    </button>
                </div>
            </div>
        </div>

        <!-- Link preview loading -->
        <div class="tw-mt-4 tw-flex tw-items-center tw-gap-3 tw-rounded-lg tw-bg-gray-50 tw-p-4" *ngIf="isLoadingPreview()">
            <mat-progress-bar mode="indeterminate" class="tw-flex-1"></mat-progress-bar>
            <span class="tw-text-sm tw-text-gray-600">Cargando vista previa del enlace...</span>
        </div>

        <!-- Link preview -->
        <div class="tw-mt-4 tw-group tw-relative" *ngIf="linkPreview">
            <div class="tw-flex tw-overflow-hidden tw-rounded-lg tw-border tw-border-gray-200 tw-bg-white tw-shadow-sm">
                <img 
                    *ngIf="linkPreview.image" 
                    [src]="linkPreview.image" 
                    [alt]="linkPreview.title"
                    class="tw-h-24 tw-w-24 tw-flex-shrink-0 tw-object-cover sm:tw-h-32 sm:tw-w-32"
                />
                <div class="tw-flex tw-flex-1 tw-flex-col tw-justify-between tw-p-4">
                    <div>
                        <h4 class="tw-line-clamp-2 tw-text-sm tw-font-semibold tw-text-gray-900">
                            {{ linkPreview.title }}
                        </h4>
                        <p class="tw-mt-1 tw-line-clamp-2 tw-text-xs tw-text-gray-600">
                            {{ linkPreview.description }}
                        </p>
                    </div>
                    <a 
                        [href]="linkPreview.url" 
                        target="_blank" 
                        class="tw-mt-2 tw-text-xs tw-text-blue-600 tw-no-underline hover:tw-underline"
                    >
                        {{ linkPreview.url }}
                    </a>
                </div>
            </div>
            <button
                type="button"
                (click)="removeLinkPreview()"
                class="tw-absolute tw-right-2 tw-top-2 tw-flex tw-h-6 tw-w-6 tw-items-center tw-justify-center tw-rounded-full tw-bg-neutral-400  tw-text-white tw-opacity-0 tw-transition-opacity group-hover:tw-opacity-100"
                title="Eliminar vista previa"
            >
                <mat-icon class="tw-text-lg tw-text-black"
                    >close</mat-icon
                >
            </button>
        </div>

        <!-- Progress bar -->
        <mat-progress-bar
            *ngIf="isLoading()"
            mode="indeterminate"
            class="tw-mt-4"
        ></mat-progress-bar>

        <div class="tw--mx-3 tw-mt-6 tw-flex tw-items-center sm:tw-mt-8">
            <input
                type="file"
                #fileInput
                (change)="onFileSelected($event)"
                multiple
                accept="image/*"
                class="tw-hidden"
            />
            <button
                type="button"
                class="tw-mr-1 tw-px-3"
                mat-button
                (click)="fileInput.click()"
                [disabled]="isLoading()"
            >
                <mat-icon
                    class="tw-icon-size-5"
                    [svgIcon]="'heroicons_solid:photo'"
                ></mat-icon>
                <span class="tw-ml-2"
                    >Foto ({{ selectedImages.length }}/{{ maxAllowedImages }})</span
                >
            </button>

            <div class="tw-flex tw-gap-2">
                <mat-slide-toggle
                    color="primary"
                    formControlName="allowComments"
                >
                    Permitir comentarios
                </mat-slide-toggle>
            </div>

            <button
                type="submit"
                class="tw-ml-auto tw-mr-3 tw-px-6"
                mat-flat-button
                [color]="'primary'"
                [disabled]="!canSubmit"
            >
                {{ isLoading() ? 'Publicando...' : 'Publicar' }}
            </button>
        </div>
    </form>
</fuse-card>
